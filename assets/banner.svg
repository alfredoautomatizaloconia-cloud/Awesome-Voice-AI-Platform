<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009ffd;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 40px sans-serif; fill: white; text-anchor: middle; }
      .subtitle { font: 20px sans-serif; fill: #e0e0e0; text-anchor: middle; }
      .wave { animation: float 3s ease-in-out infinite; }
      @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" ry="15"/>
  <circle cx="150" cy="50" r="40" fill="rgba(255,255,255,0.05)" class="wave"/>
  <circle cx="650" cy="120" r="60" fill="rgba(255,255,255,0.1)" class="wave" style="animation-delay: 1.5s"/>
  <path d="M 0 150 Q 200 200 400 150 T 800 150 L 800 200 L 0 200 Z" fill="rgba(255,255,255,0.1)"/>
  <text x="400" y="90" class="title">🚀 Awesome Voice AI Platform</text>
  <text x="400" y="130" class="subtitle">Conversational Voice Agents, STT/TTS &amp; Orchestration 🎙️</text>
</svg>
